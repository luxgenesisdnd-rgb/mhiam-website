    <style>
        body{
            background-image:url(https://i.pinimg.com/736x/3c/d8/33/3cd833ccff90d3454a35aaf4fafed0f1.jpg);
            background-repeat: no-repeat;
            background-attachment: fixed;  
            background-size: cover;
            font-family: 'Times New Roman', Times, serif;
            color:purple;
            text-align: center;
        }
        ul {
            list-style-type: none;
            margin: auto;
            padding: 10px;
            overflow: hidden;
            background-color: #c385d6;
            width:50%;
            border: 3px solid purple;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: purple;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-family: 'Times New Roman', Times, serif;
        }

        ul li a:hover {
            background-color: #dfaee6;
        }

        .center-banner{
            margin: auto;
            width:50%;
            height:100%;
            background-image:url('https://i.pinimg.com/1200x/19/8c/3b/198c3bec00e4305321194b408033d3df.jpg');

            background-size: fixed;
            padding: 10px;
            padding-top:50px;
            padding-bottom:80px;
            border: 3px solid black;
        }
        .center-info{
            margin:auto;
            width:50%;
            height:200%;
            background-color:#f9d7fc;
            padding:10px;
            padding-bottom:150px;
            border: 3px solid #d79ede;
        }
        a:link, a:visited {
            color: purple;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        a:hover, a:active {
            color: coral;
        }
        img{
            max-width:100%;
            margin:auto;
            display:block;
        }
        h1{
            text-align:center;
        }
    @media all and (max-width:30em){
        img{
            max-width:40vw;
        }
    }
